services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: recon-backend
    restart: unless-stopped
    stop_grace_period: 360s
    read_only: true
    tmpfs:
      - /tmp:size=500M
      - /home/recon/.cache:size=200M,uid=997,gid=997
      - /home/recon/.config:size=20M,uid=997,gid=997
    volumes:
      - recon-data:/data
      # Note: wordlists are baked into the image by build-wordlists.sh (/app/wordlists/).
      # Custom wordlists go in /data/wordlists/custom/ (persisted in the recon-data volume).
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - XDG_CONFIG_HOME=/data/tool-configs
      - HOME=/home/recon
      # ── Set these for remote deployments ──────────────────────────────────
      # Replace YOUR_SERVER_IP with your actual server IP or hostname
      # - ALLOWED_ORIGINS=["http://YOUR_SERVER_IP:8080"]
      # - TRUSTED_HOSTS=["YOUR_SERVER_IP","YOUR_SERVER_IP:8080"]
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "3.5"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "8000"
    networks:
      - recon-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: recon-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=10M
      - /var/cache/nginx:size=50M
      - /var/run:size=1M
    ports:
      - "8080:80"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - recon-net

volumes:
  recon-data:
    driver: local

networks:
  recon-net:
    driver: bridge
