# Rate limiting zone (must be in http context — nginx loads conf.d/ inside http {})
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Docker internal DNS — variable in proxy_pass defers resolution to request time
    # so nginx starts cleanly even before backend is ready.
    resolver 127.0.0.11 valid=30s;
    set $backend "backend:8000";

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options              "nosniff"                                always;
    add_header X-Frame-Options                     "DENY"                                   always;
    add_header X-XSS-Protection                    "1; mode=block"                          always;
    add_header Referrer-Policy                     "strict-origin-when-cross-origin"        always;
    add_header Content-Security-Policy             "default-src 'self'; script-src 'self' 'sha256-w1Hvv4J9qM+P6Tcm7hZMWuRiia3gi/5Ho3QIckqGAes=' 'sha256-mJu/mVsPkz1l+rOJP6GOVEjGiuTTACNm70MEwiIro0o='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost https://localhost ws://localhost wss://localhost; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy                  "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Cross-origin isolation headers — prevents Spectre-class side-channel attacks
    # Note: COEP require-corp will block Google Fonts if ever loaded cross-origin;
    # keep 'unsafe-none' unless you fully self-host all assets.
    add_header Cross-Origin-Opener-Policy          "same-origin"                            always;
    add_header Cross-Origin-Embedder-Policy        "unsafe-none"                            always;
    add_header Cross-Origin-Resource-Policy        "same-origin"                            always;

    # ── Slowloris / request timeout hardening ─────────────────────────────────
    client_header_timeout  10s;
    client_body_timeout    10s;
    keepalive_timeout      30s;
    send_timeout           10s;
    client_max_body_size   10M;
    client_body_buffer_size 16k;

    # ── Rate limit response code ──────────────────────────────────────────────
    limit_req_status 429;

    # ── Deny source maps — expose full TypeScript source if served ────────────
    location ~* \.map$ {
        deny all;
        return 404;
    }

    # ── Deny hidden files and backup/config files ─────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(bak|conf|dist|fla|inc|ini|log|sh|sql|swp|swo)$ {
        deny all;
        return 404;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → backend (full URI forwarded as-is) ───────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite (not append) X-Forwarded-For with real client IP —
        # prevents clients from spoofing this header to bypass rate limits.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket proxy → backend ─────────────────────────────────────────────
    location /ws {
        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400;
    }
}
